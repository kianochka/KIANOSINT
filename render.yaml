services:
  - type: worker
    name: kianosint
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bot
    autoDeploy: true
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: ADMIN_USER_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kianosint-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: kianosint-db
    plan: free
    databaseName: kianosint
    user: kianosint